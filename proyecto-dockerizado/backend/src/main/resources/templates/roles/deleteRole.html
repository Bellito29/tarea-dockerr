<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <title>Eliminar Roles</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/header.css}" />
    <link rel="stylesheet" th:href="@{/listUsers.css}" />
</head>
<body>
<div class="container mt-5">
    <h2>Eliminar Roles</h2>

    <table class="table table-bordered table-hover mt-3">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Usuarios asignados</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="role : ${roles}">
            <td th:text="${role.id}"></td>
            <td th:text="${role.name}"></td>
            <td th:text="${role.description}"></td>
            <td th:text="${role.users != null ? role.users.size() : 0}"></td>
            <td>
                <form th:action="@{/mvc/roles/delete/{id}(id=${role.id})}" method="post">
                    <button type="submit" class="btn btn-danger btn-sm"
                            onclick="return confirm('¿Seguro que deseas eliminar este rol? Los usuarios asignados quedarán sin rol.')">
                        Eliminar
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <a th:href="@{/mvc/home}" class="btn btn-secondary mt-2">Volver</a>
</div>
</body>
</html>
