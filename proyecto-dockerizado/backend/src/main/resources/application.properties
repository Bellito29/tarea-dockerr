# Aplicación
spring.application.name=demo

# Servidor
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/biggapp}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:biggapp_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Inicialización de datos
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.encoding=UTF-8

# JSON
spring.jackson.serialization.indent-output=true

# JWT
app.security.jwt.secret-key=${JWT_SECRET_KEY:mySecretKey123456789012345678901234567890123456789012345678901234567890}
app.security.jwt.expiration-time=${JWT_EXPIRATION_TIME:86400000}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
